// 足球比赛参数。按固定顺序读取，修改名称不会改变对应关系；请保留数值行的顺序。
goalWidth                       100

// 支援候选点网格的横向和纵向数量。
numSweetSpotsX                  13
numSweetSpotsY                  6

// 支援点评分权重：安全传球、射门机会以及与控球者的距离等。
spotCanPassScore                     2.0
spotCanScoreFromPositionScore        1.0
spotDistFromControllingPlayerScore    2.0
spotClosenessToSupportingPlayerScore 0.0
spotAheadOfAttackerScore             0.0

// 每秒重新计算支援点评分的次数。
supportSpotUpdateFreq           1

// 球员随机尝试远射的概率。
chancePlayerAttemptsPotShot     0.005

// 接球时选择减速到达行为的概率；另一种方式是追踪足球。
chanceOfUsingArriveTypeReceiveBehavior  0.5

ballSize                        5.0
ballMass                        1.0
friction                        -0.015

// 守门员能够接住足球的距离。
keeperInBallRange               10.0
playerInTargetRange             10.0

// 球员能够踢到足球的距离；值越大，抢球越容易。
playerKickingDistance           6.0

// 每秒允许踢球的次数。
playerKickFrequency               8

playerMass                      3.0
playerMaxForce                  1.0
playerMaxSpeedWithBall          1.2
playerMaxSpeedWithoutBall       1.6
playerMaxTurnRate               0.4
playerScale                     1.0

// 对手进入此距离时产生威胁，球员会更倾向传球。
playerComfortZone               60.0

// 踢球精度为零到一；越低表示方向误差越大。
playerKickingAccuracy           0.99

// 判断能否射门时最多尝试的随机目标数量。
numAttemptsToFindValidStrike    5

maxDribbleForce                 1.5
maxShootingForce                6.0
maxPassingForce                 3.0


// 球员到自己的站位中心的距离阈值。
withinRangeOfHome               15.0

// 判断是否到达支援目标的距离阈值。
withinRangeOfSweetSpot          15.0

// 普通传球要求接球者与传球者的最小距离。
minPassDistance                 120.0
// 守门员传球要求接球者与守门员的最小距离。
goalkeeperMinPassDistance       50.0

// 守门员阻挡行为中与球门侧目标保持的距离。
entityPlayerGoalKeeperTendingDistance       20.0

// 守门员考虑出击拦截时的足球距离阈值。
entityPlayerGoalKeeperInterceptRange              100.0

// 接球队员开始追球时的足球距离阈值。
ballWithinReceivingRange        10.0

// 调试显示开关：一表示开启，零表示关闭。
viewStates                          1
viewIDs                             1
viewSupportSpots                    1
viewRegions                         0
bShowControllingTeam                1
viewTargets                         0
highlightIfThreatened               0

// 物理计算以每次更新为时间单位；改变更新频率也会改变实际运动速度。
frameRate                           60;


// 移动行为参数：分离力权重。
separationCoefficient                10.0;

// 邻居感知距离，用于球员间的分离行为。
viewDistance                        30.0;

// 重叠分离开关：一表示开启，零表示关闭。
bNonPenetrationConstraint           0
